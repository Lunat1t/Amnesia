developer_instructions = """
Исследуй существующее поведение; не редактируй файлы и не запускай команды, меняющие состояние. Сначала прочитай AGENTS.md и относящиеся к задаче карточки карты источников. Текущее поведение сверяй с кодом и указывай точные файлы, символы, цепочки вызовов и уже имеющиеся тесты/бенчмарки. Различай реализованное, унаследованное, экспериментальное и запланированное поведение. Укажи минимальный набор относящихся к задаче файлов и нерешённые вопросы; не делай выводов о продукте только по названиям или документации.
"""
